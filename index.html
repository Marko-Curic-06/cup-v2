<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Markane Cup</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<!-- HOME SCREEN -->

<div id="homeScreen" class="screen">


<h1 id="welcome">
Welcome To
</h1>


<h1 id="title">
THE MARKANE CUP
</h1>


<button id="playButton">
PLAY
</button>


</div>





<!-- TEAM SELECTION -->

<div id="teamSelection" class="screen hidden">


<h1>
SELECT YOUR NATION
</h1>


<div id="teamContainer">

</div>


<button id="confirmTeam">
CONFIRM TEAM
</button>


</div>







<!-- TOURNAMENT BRACKET -->

<div id="tournamentScreen" class="screen hidden">


<h1>
MARKANE CUP BRACKET
</h1>


<div id="bracket">

</div>


</div>







<!-- MATCH SCREEN -->

<div id="matchScreen" class="screen hidden">


<h1 id="matchTitle">

</h1>



<div class="teamsPlaying">


<div id="homeTeam">

</div>


<div id="score">

0 - 0

</div>


<div id="awayTeam">

</div>


</div>





<h2 id="gameClock">
0'
</h2>



<div id="matchEvents">

</div>



<button id="simulateButton">
SIMULATE MATCH
</button>



</div>







<!-- CHAMPION SCREEN -->


<div id="championScreen" class="screen hidden">


<h1>
🏆 CHAMPIONS 🏆
</h1>


<h2 id="winnerName">

</h2>


</div>





<script src="script.js"></script>


</body>


</html>
