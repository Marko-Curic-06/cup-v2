<!DOCTYPE html>
<html>

<head>

<title>Markane Cup</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<!-- WELCOME SCREEN -->

<div id="welcomeScreen">

<h1 class="drop">
Welcome To
</h1>


<h2 class="drop delay">
THE MARKANE CUP
</h2>


<button id="playButton">
PLAY
</button>


</div>





<!-- TEAM SELECTION SCREEN -->

<div id="teamSelection" class="hidden">


<h1>
SELECT YOUR TEAM
</h1>


<div id="teamList"></div>


<button id="confirmTeam">
CONFIRM TEAM
</button>


</div>







<!-- TOURNAMENT SCREEN -->

<div id="tournamentScreen" class="hidden">


<h1>
🏆 MARKANE CUP 🏆
</h1>



<div id="bracket">


<div class="round">


<h2>
Quarter Finals
</h2>


<div id="quarterFinals"></div>


</div>




<div class="round">


<h2>
Semi Finals
</h2>


<div id="semiFinals"></div>


</div>





<div class="round">


<h2>
Final
</h2>


<div id="finalMatch"></div>


</div>


</div>


</div>








<!-- MATCH SCREEN -->


<div id="matchScreen" class="hidden">


<h1 id="matchTitle">
</h1>


<h2 id="scoreBoard">
0 - 0
</h2>



<h2 id="gameClock">
0'
</h2>



<button id="simulateButton">
SIMULATE MATCH
</button>



<div id="matchEvents">

</div>


</div>









<!-- BROADCAST SCREEN -->


<div id="broadcastScreen" class="hidden">


<h1 id="broadcastTitle">
</h1>


<h2 id="broadcastTeams">
</h2>



<div id="broadcastContent">
</div>



<button id="nextButton">
CONTINUE
</button>


</div>









<!-- STATISTICS -->


<div id="statistics">


<h2>
Tournament Statistics
</h2>


<div id="goldenBoot">

</div>



<div id="assistLeaders">

</div>


</div>









<!-- CHAMPION SCREEN -->


<div id="championScreen" class="hidden">


<h1>
🏆 CHAMPIONS 🏆
</h1>



<div id="winnerName">

</div>


</div>









<script src="script.js"></script>


</body>


</html>
